<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Rect -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3"/>
  
  <!-- DevTools Inspector Pointer Frame -->
  <rect x="30" y="30" width="68" height="68" rx="12" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-dasharray="8 4"/>
  
  <!-- Inspection Crosshair / Pointer -->
  <circle cx="64" cy="64" r="14" fill="none" stroke="#38bdf8" stroke-width="4" filter="url(#glow)"/>
  <circle cx="64" cy="64" r="5" fill="#10b981"/>
  
  <!-- Corners highlight -->
  <path d="M 24 40 L 24 24 L 40 24" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 104 40 L 104 24 L 88 24" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 24 88 L 24 104 L 40 104" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <path d="M 104 88 L 104 104 L 88 104" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
</svg>
