<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qursor++</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-wrapper">
        <img src="../assets/logo.svg" alt="Qursor++ Logo" class="logo">
        <div class="title-container">
          <h1 class="title">Qursor++</h1>
          <span class="version-tag">Point. Inspect. Generate. Build.</span>
        </div>
      </div>
      <div class="theme-switcher" id="themeSwitcher">
        <button class="theme-btn active" data-theme-val="light" title="Light Theme">☀️</button>
        <button class="theme-btn" data-theme-val="dark" title="Dark Theme">🌙</button>
      </div>
    </header>

    <!-- Main Content Card -->
    <main class="main-content">
      <!-- Status Pill -->
      <div class="status-card" id="statusCard">
        <div class="status-indicator" id="statusIndicator"></div>
        <div class="status-info">
          <span class="status-label">INSPECTOR STATUS</span>
          <span class="status-text" id="statusText">Ready to Inspect</span>
        </div>
      </div>

      <!-- Primary Action Button -->
      <div class="actions">
        <button id="toggleBtn" class="btn btn-primary">
          <span class="btn-icon">⚡</span>
          <span id="btnText">Enable Inspector</span>
        </button>
      </div>

      <!-- Quick Info / Keyboard Shortcuts -->
      <div class="shortcuts-card">
        <div class="shortcut-item">
          <span class="shortcut-label">Toggle Inspector</span>
          <kbd class="shortcut-key">Ctrl + Shift + I</kbd>
        </div>
        <div class="shortcut-item">
          <span class="shortcut-label">Exit Inspect Mode</span>
          <kbd class="shortcut-key">ESC</kbd>
        </div>
      </div>

      <!-- Feature Badges -->
      <div class="features-badge-row">
        <span class="f-badge">T Typography</span>
        <span class="f-badge">🎨 Colors</span>
        <span class="f-badge">🖼️ Assets</span>
        <span class="f-badge">📄 Code</span>
        <span class="f-badge">👤 Prompt</span>
      </div>

      <!-- Navigation Links -->
      <div class="footer-links">
        <button id="docBtn" class="btn-link">
          <span>📚 Docs</span>
        </button>
        <button id="settingsBtn" class="btn-link">
          <span>⚙️ Settings</span>
        </button>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>

</html>
